     id="g40"
     transform="translate(-65,-0.52299881)">
    <text
       x="390"
       y="70"
       font-weight="bold"
       id="text24">Rotating <tspan font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif">|0⟩</tspan> by <tspan font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan></text>
    <text
       x="390"
       y="104"
       id="text27"><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan25">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   dx="4"
       id="tspan26">= 0</tspan> → <tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan27">|0⟩</tspan>, always measure 0</text>
    <text
       x="390"
       y="132"
       id="text29"><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan28">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   dx="4"
       id="tspan29">= π/2</tspan> → equal superposition,</text>
    <text
       x="440"
       y="152"
       id="text30">measure 1 half the time</text>
    <text
       x="390"
       y="180"
       id="text32"><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan30">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   dx="4"
       id="tspan31">= π</tspan> → <tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan32">|1⟩</tspan>, always measure 1</text>
    <text
       x="390"
       y="224"
       id="text37">state: <tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan33">cos(</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan34">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan35">/2) |0⟩ + sin(</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan36">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan37">/2) |1⟩</tspan></text>
    <text
       x="390"
       y="250"
       id="text40">probability of 1: <tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan38">sin²(</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   font-style="italic"
   id="tspan39">θ</tspan><tspan
   font-family="'Latin Modern Math', 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"
   id="tspan40">/2)</tspan></text>
  </g>
