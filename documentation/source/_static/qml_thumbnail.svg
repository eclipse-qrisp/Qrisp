<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="#ffffff"/>
  <!-- soft glow behind each class -->
  <ellipse cx="190" cy="215" rx="120" ry="135" fill="#20306f" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="420" cy="185" rx="120" ry="135" fill="#7000e1" opacity="0.18" filter="url(#soft)"/>
  <!-- decision boundary -->
  <path d="M 262 28 C 390 120, 205 255, 350 372" fill="none" stroke="#444444" stroke-width="5" stroke-linecap="round"/>
  <!-- class A, navy -->
  <g fill="#20306f" filter="url(#edge)">
    <circle cx="150" cy="120" r="17"/><circle cx="205" cy="165" r="12"/><circle cx="120" cy="205" r="21"/>
    <circle cx="190" cy="240" r="15"/><circle cx="235" cy="300" r="11"/><circle cx="140" cy="300" r="16"/>
    <circle cx="95" cy="140" r="9"/><circle cx="230" cy="95" r="10"/><circle cx="260" cy="225" r="8"/>
    <circle cx="190" cy="335" r="9"/>
    <!-- a few on the wrong side -->
    <circle cx="345" cy="205" r="11"/><circle cx="445" cy="255" r="8"/>
  </g>
  <!-- class B, violet -->
  <g fill="#7000e1" filter="url(#edge)">
    <circle cx="430" cy="105" r="15"/><circle cx="370" cy="160" r="11"/><circle cx="480" cy="175" r="20"/>
    <circle cx="410" cy="230" r="16"/><circle cx="500" cy="270" r="12"/><circle cx="440" cy="310" r="17"/>
    <circle cx="350" cy="70" r="9"/><circle cx="520" cy="110" r="9"/><circle cx="375" cy="290" r="8"/>
    <circle cx="395" cy="355" r="10"/>
    <!-- a few on the wrong side -->
    <circle cx="262" cy="150" r="10"/>
  </g>
</svg>
