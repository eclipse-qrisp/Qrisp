<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .math { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; }
      .up { font-style: normal; }
      .caption { font-size: 13px; fill: #57606a; }
      .gate { fill: #ffffff; stroke-width: 1.4; }
      .wire { stroke: #24292f; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="920" height="370" rx="10" fill="#ffffff"/>

  <!-- quantum part -->
  <rect x="20" y="50" width="590" height="230" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="34" y="72" text-anchor="start" class="caption">quantum circuit</text>

  <!-- input data -->
  <text x="190" y="30" class="math" font-size="16"><tspan font-family="Helvetica, Arial, sans-serif" font-style="normal" font-size="14" fill="#57606a">one input sample:</tspan><tspan dx="4" text-decoration="underline">x</tspan><tspan class="up" dx="4">= (</tspan>x<tspan font-size="11" dy="4" class="up">0</tspan><tspan dy="-4">, x</tspan><tspan font-size="11" dy="4" class="up">1</tspan><tspan dy="-4" class="up">)</tspan></text>
  <line x1="190" y1="38" x2="190" y2="88" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- block backgrounds, then wires, then gates -->
  <rect x="120" y="90" width="140" height="150" rx="8" fill="#e6f4ea" stroke="#2da44e" stroke-width="1.4"/>
  <rect x="290" y="90" width="230" height="150" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>

  <!-- wires -->
  <text x="62" y="130" class="math" font-size="16"><tspan class="up">|0⟩</tspan></text>
  <text x="62" y="210" class="math" font-size="16"><tspan class="up">|0⟩</tspan></text>
  <line x1="84" y1="125" x2="548" y2="125" class="wire"/>
  <line x1="84" y1="205" x2="560" y2="205" class="wire"/>

  <!-- encoding block -->
  <rect x="150" y="109" width="80" height="32" rx="4" class="gate" stroke="#2da44e"/>
  <rect x="150" y="189" width="80" height="32" rx="4" class="gate" stroke="#2da44e"/>
  <text x="190" y="130" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>x<tspan font-size="10" dy="4" class="up">0</tspan><tspan dy="-4" class="up">)</tspan></text>
  <text x="190" y="210" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>x<tspan font-size="10" dy="4" class="up">1</tspan><tspan dy="-4" class="up">)</tspan></text>
  <text x="190" y="262" class="caption">encoding <tspan class="math" fill="#24292f">S(<tspan text-decoration="underline">x</tspan>)</tspan></text>

  <!-- ansatz block -->
  <rect x="300" y="109" width="70" height="32" rx="4" class="gate" stroke="#0969da"/>
  <rect x="300" y="189" width="70" height="32" rx="4" class="gate" stroke="#0969da"/>
  <rect x="440" y="109" width="70" height="32" rx="4" class="gate" stroke="#0969da"/>
  <rect x="440" y="189" width="70" height="32" rx="4" class="gate" stroke="#0969da"/>
  <text x="335" y="130" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>w<tspan font-size="10" dy="4" class="up">0</tspan><tspan dy="-4" class="up">)</tspan></text>
  <text x="335" y="210" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>w<tspan font-size="10" dy="4" class="up">1</tspan><tspan dy="-4" class="up">)</tspan></text>
  <text x="475" y="130" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>w<tspan font-size="10" dy="4" class="up">2</tspan><tspan dy="-4" class="up">)</tspan></text>
  <text x="475" y="210" class="math">R<tspan font-size="10" dy="4">Y</tspan><tspan dy="-4" class="up">(</tspan>w<tspan font-size="10" dy="4" class="up">3</tspan><tspan dy="-4" class="up">)</tspan></text>
  <!-- CX: control on qubit 0, target on qubit 1 -->
  <line x1="405" y1="125" x2="405" y2="217" stroke="#24292f" stroke-width="1.4"/>
  <circle cx="405" cy="125" r="5" fill="#24292f"/>
  <circle cx="405" cy="205" r="12" fill="#ffffff" stroke="#24292f" stroke-width="1.4"/>
  <line x1="393" y1="205" x2="417" y2="205" stroke="#24292f" stroke-width="1.4"/>
  <line x1="405" y1="193" x2="405" y2="217" stroke="#24292f" stroke-width="1.4"/>
  <text x="405" y="262" class="caption">ansatz <tspan class="math" fill="#24292f">W(<tspan text-decoration="underline">w</tspan>)</tspan></text>

  <!-- states between the blocks -->
  <text x="275" y="82" class="math" fill="#57606a"><tspan class="up">|</tspan>ψ(<tspan text-decoration="underline">x</tspan>)<tspan class="up">⟩</tspan></text>
  <text x="540" y="82" class="math" fill="#57606a"><tspan class="up">|</tspan>ψ(<tspan text-decoration="underline">x</tspan>, <tspan text-decoration="underline">w</tspan>)<tspan class="up">⟩</tspan></text>

  <!-- measurement -->
  <rect x="548" y="107" width="44" height="36" rx="4" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/>
  <path d="M 556 134 A 14 14 0 0 1 584 134" fill="none" stroke="#24292f" stroke-width="1.4"/>
  <line x1="570" y1="134" x2="580" y2="116" stroke="#24292f" stroke-width="1.4"/>
  <text x="570" y="162" class="math" font-size="13">Z<tspan font-size="9" dy="4" class="up">0</tspan></text>

  <!-- classical part -->
  <rect x="625" y="50" width="287" height="308" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="639" y="72" text-anchor="start" class="caption">classical</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="1.4">
    <rect x="640" y="95" width="265" height="60" rx="8"/>
    <rect x="640" y="185" width="265" height="60" rx="8"/>
    <rect x="640" y="285" width="265" height="60" rx="8"/>
  </g>
  <text x="772" y="116" font-weight="bold" font-size="13">prediction</text>
  <text x="772" y="142" class="math" font-size="15">f(<tspan text-decoration="underline">x</tspan>; <tspan text-decoration="underline">w</tspan>) <tspan class="up">= ⟨</tspan>ψ(<tspan text-decoration="underline">x</tspan>, <tspan text-decoration="underline">w</tspan>)<tspan class="up">|</tspan>Z<tspan font-size="10" dy="4" class="up">0</tspan><tspan dy="-4" class="up">|</tspan>ψ(<tspan text-decoration="underline">x</tspan>, <tspan text-decoration="underline">w</tspan>)<tspan class="up">⟩</tspan></text>
  <text x="772" y="206" font-weight="bold" font-size="13">loss</text>
  <text x="772" y="232" class="math" font-size="15">L(<tspan text-decoration="underline">w</tspan>) <tspan class="up">= mean</tspan><tspan font-size="10" dy="4">i</tspan><tspan dy="-4" class="up"> (</tspan>f(<tspan text-decoration="underline">x</tspan><tspan font-size="10" dy="-7" class="up">(</tspan><tspan font-size="10">i</tspan><tspan font-size="10" class="up">)</tspan><tspan dy="7">; <tspan text-decoration="underline">w</tspan>) − y</tspan><tspan font-size="10" dy="-7" class="up">(</tspan><tspan font-size="10">i</tspan><tspan font-size="10" class="up">)</tspan><tspan dy="7" class="up">)²</tspan></text>
  <text x="772" y="306" font-weight="bold" font-size="13">optimizer</text>
  <text x="772" y="332" font-size="14">new <tspan class="math"><tspan text-decoration="underline">w</tspan></tspan> with lower <tspan class="math">L(<tspan text-decoration="underline">w</tspan>)</tspan></text>

  <g stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="592" y1="125" x2="638" y2="125"/>
    <line x1="772" y1="155" x2="772" y2="183"/>
    <line x1="772" y1="245" x2="772" y2="283"/>
    <polyline points="640,315 495,315 495,242" stroke-dasharray="5 4"/>
  </g>
  <text x="505" y="305" text-anchor="start" class="caption">update <tspan class="math" fill="#24292f"><tspan text-decoration="underline">w</tspan></tspan></text>
</svg>
