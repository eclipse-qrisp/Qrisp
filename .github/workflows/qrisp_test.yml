name: Qrisp unit tests via Pytest

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test Py${{ matrix.python-version }} (${{ matrix.test-group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.*", "3.12.*"]
        test-group:
          - name: core
            paths: "tests/circuit_tests tests/core_tests tests/primitives_tests tests/jax_tests tests/test_typing.py"
          - name: algorithms-and-integrations
            paths: "tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"

      - name: Test with pytest (${{ matrix.test-group.name }})
        run: |
          pytest ${{ matrix.test-group.paths }} \
            --cov=qrisp \
            --cov-report=term-missing \
            --cov-branch

  benchmark:
    name: Benchmark Py3.11 (${{ matrix.test-group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        test-group:
          - name: core
            paths: "tests/circuit_tests tests/core_tests tests/primitives_tests tests/jax_tests tests/test_typing.py"
          - name: algorithms-and-integrations
            paths: "tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.*"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"

      - name: Get latest main run ID
        id: get-run-id
        run: |
          RUN_ID=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=main&status=success&per_page=1&event=push" \
            | jq -r '.workflow_runs[0].id // empty')
          echo "run-id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download benchmark baseline
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: benchmark-data-3.11-${{ matrix.test-group.name }}
          path: .benchmarks/
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-run-id.outputs.run-id }}

      - name: Run benchmarks
        run: |
          COMPARE_FAIL=""
          if ls .benchmarks/*/*.json 1>/dev/null 2>&1; then
            COMPARE_FAIL="--benchmark-compare-fail=min:15%"
          fi
          QRISP_BENCHMARK_ALL=true pytest \
            ${{ matrix.test-group.paths }} \
            --benchmark-autosave \
            --benchmark-compare \
            $COMPARE_FAIL \
            --benchmark-min-rounds=1

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-data-3.11-${{ matrix.test-group.name }}
          path: .benchmarks/
          include-hidden-files: true
