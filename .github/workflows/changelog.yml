name: Changelog and License Header Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR head, not the synthetic merge commit. The merge
          # commit contains everything on main as well, so diffing it against
          # the base would count other PRs' changelog entries as this PR's.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check changelog-dev.rst for entries
        id: check
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | \
             grep -q "documentation/source/general/changelog/changelog-dev.rst"; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if no changelog entry
        if: steps.check.outputs.modified == 'false'
        run: |
          echo "::warning::No changelog entry found - please add an entry to documentation/source/general/changelog/changelog-dev.rst"
          exit 1

      - name: Check license headers
        run: |
          expected=$(cat <<'HEADER'
          # ********************************************************************************
          # * Copyright (c) 2026 the Qrisp authors
          # *
          # * This program and the accompanying materials are made available under the
          # * terms of the Eclipse Public License 2.0 which is available at
          # * http://www.eclipse.org/legal/epl-2.0.
          # *
          # * This Source Code may also be made available under the following Secondary
          # * Licenses when the conditions for such availability set forth in the Eclipse
          # * Public License, v. 2.0 are satisfied: GNU General Public License, version 2
          # * with the GNU Classpath Exception which is
          # * available at https://www.gnu.org/software/classpath/license.html.
          # *
          # * SPDX-License-Identifier: EPL-2.0 OR GPL-2.0 WITH Classpath-exception-2.0
          # ********************************************************************************
          HEADER
          )
          files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }}...HEAD -- '*.py' | \
                  grep -v '^documentation/' || true)
          for f in $files; do
            if ! head -n 15 "$f" | diff -q - <(printf '%s\n' "$expected") > /dev/null; then
              echo "::error file=$f::Missing or incorrect license header. Expected header:"
              printf '%s\n' "$expected"
              exit 1
            fi
          done
