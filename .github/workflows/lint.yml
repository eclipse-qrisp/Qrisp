name: lint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11.*", "3.12.*"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-code-style]"
      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
      - name: Codespell
        run: |
          codespell || {
            echo "::warning::The Qrisp project uses American English. Found spelling issues (see above)."
            echo "::warning::Run 'codespell' locally to see the full list, or 'codespell -w' to auto-fix."
            echo "::warning::To suppress: add '# codespell:ignore' to the line, or add the keyword to 'ignore-words-list' in pyproject.toml."
            exit 1
          }
