# Runs selectively: only tests related to changed src/qrisp/ files are executed.
# Coverage is scoped to just the changed files.
# Falls back to full suite if selective mapping fails.

name: Coverage

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Py3.12.*
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for git diff against base

      - name: Set up Python 3.12.*
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"

      - name: Derive test files for changed sources
        id: test-files
        run: |
          python << 'PYEOF'
          import os, subprocess, sys

          ALL_TESTS = "tests"

          def write(test_paths, cov_include):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'test_paths={test_paths}\n')
                  f.write(f'cov_include={cov_include}\n')

          TEST_MAP = {
              'src/qrisp/typing.py': 'tests/test_typing.py',
              'src/qrisp/default_backend.py': 'tests/core_tests/test_default_backend.py',
              'src/qrisp/helloworld.py': 'tests/core_tests/test_hello_world.py',
              'alg_primitives': 'tests/primitives_tests',
              'jasp': 'tests/jax_tests',
              'simulator': 'tests/interface_tests',
          }

          # Modules mapping to test dirs — convention: tests/<module>_tests
          MODULE_DIR = {
              'alg_primitives': 'tests/primitives_tests',
              'jasp': 'tests/jax_tests',
              'simulator': 'tests/interface_tests',
              'environments': 'tests/core_tests',
              'qtypes': 'tests/core_tests',
              'misc': 'tests/core_tests',
              'permeability': 'tests/core_tests',
          }

          def test_dir(module):
              return MODULE_DIR.get(module, f'tests/{module}_tests')

          changed = []
          if os.environ.get('EVENT_NAME') == 'pull_request':
              ref = os.environ['BASE_REF']
              r = subprocess.run(['git', 'diff', '--name-only', f'origin/{ref}...HEAD',
                                  '--', 'src/qrisp/*.py', 'src/qrisp/**/*.py'],
                                 capture_output=True, text=True)
              changed = [f.strip() for f in r.stdout.strip().split('\n') if f.strip()]

          if not changed:
              write(ALL_TESTS, 'qrisp')
              sys.exit(0)

          # If __init__.py changed or any file can't be mapped, run all tests
          test_files = []
          for src in changed:
              if src in TEST_MAP:
                  test_files.append(TEST_MAP[src])
              elif src == 'src/qrisp/__init__.py' or src.endswith('/__init__.py'):
                  write(ALL_TESTS, 'qrisp')
                  sys.exit(0)
              elif not src.startswith('src/qrisp/'):
                  write(ALL_TESTS, 'qrisp')
                  sys.exit(0)
              else:
                  rel = src[len('src/qrisp/'):]
                  parts = rel.split('/')
                  tdir = test_dir(parts[0])
                  if not os.path.isdir(tdir):
                      write(ALL_TESTS, 'qrisp')
                      sys.exit(0)
                  name = parts[-1].replace('.py', '')
                  if len(parts) == 2:
                      candidate = f'{tdir}/test_{name}.py'
                  elif parts[0] == 'jasp':
                      candidate = f'{tdir}/test_{name}.py'
                  elif rel.startswith('alg_primitives/mcx_algs/'):
                      c1 = f'tests/core_tests/mcx_tests/test_{name}.py'
                      c2 = f'tests/core_tests/mcx_tests/test_{name}_mcx.py'
                      candidate = c1 if os.path.exists(c1) else c2
                  else:
                      c1 = f'{tdir}/{parts[1]}_tests/test_{name}.py'
                      candidate = c1 if os.path.exists(c1) else f'{tdir}/test_{name}.py'
                  if not os.path.exists(candidate):
                      write(ALL_TESTS, 'qrisp')
                      sys.exit(0)
                  test_files.append(candidate)

          test_files = list(dict.fromkeys(test_files))
          write(' '.join(test_files), ','.join(changed))
          PYEOF
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      # Run pytest on just the derived test paths.
      # --cov=qrisp instruments the whole package so imports are tracked correctly.
      # The separate report step below filters the output to only changed files.
      - name: Run related tests
        run: |
          pytest ${{ steps.test-files.outputs.test_paths }} \
            --cov=qrisp \
            --cov-branch

      # coverage report --include filters to only the changed src files,
      # so the output shows coverage for exactly what was modified, not the entire package.
      - name: Report coverage for changed files
        run: |
          INCLUDE="${{ steps.test-files.outputs.cov_include }}"
          if [[ "$INCLUDE" == "qrisp" ]]; then
            coverage report --show-missing --omit='*/__init__.py'
          else
            coverage report --include="$INCLUDE" --show-missing --omit='*/__init__.py'
          fi
