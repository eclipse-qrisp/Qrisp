name: Coverage

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (Py3.12.*)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.12.*
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"
      - name: Determine coverage targets
        id: cov-targets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin ${{ github.base_ref }}
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/qrisp/*.py' 'src/qrisp/**/*.py' || true)
            if [[ -z "$CHANGED" ]]; then
              echo "targets=--cov=qrisp" >> "$GITHUB_OUTPUT"
            else
              ARGS=""
              while IFS= read -r file; do
                ARGS="$ARGS --cov=$file"
              done <<< "$CHANGED"
              echo "targets=$ARGS" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "targets=--cov=qrisp" >> "$GITHUB_OUTPUT"
          fi
      - name: Test with pytest and coverage
        run: |
          pytest tests/circuit_tests tests/core_tests tests/primitives_tests tests/jax_tests tests/test_typing.py tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests \
            ${{ steps.cov-targets.outputs.targets }} \
            --cov-report=term-missing \
            --cov-branch
