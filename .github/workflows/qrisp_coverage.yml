name: Coverage

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"
      - name: Run core tests with coverage
        run: |
          pytest tests/circuit_tests tests/core_tests tests/primitives_tests tests/jax_tests tests/test_typing.py \
            --cov=qrisp \
            --cov-branch \
            --cov-report=term:skip-covered
      - name: Run algorithms-and-integrations tests with coverage
        run: |
          pytest tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests \
            --cov=qrisp \
            --cov-branch \
            --cov-report=term:skip-covered \
            --cov-append
      - name: Report coverage
        run: |
          coverage report --show-missing --omit='*/__init__.py'
