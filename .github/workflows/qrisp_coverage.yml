name: Coverage

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"
      - name: Run core tests with coverage
        run: |
          pytest tests/circuit_tests tests/core_tests tests/primitives_tests tests/jax_tests tests/test_typing.py \
            --cov=qrisp \
            --cov-branch \
            --cov-report=term:skip-covered
        env:
          COVERAGE_FILE: .coverage.core
      - name: Upload core coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: .coverage.core
          include-hidden-files: true

  algorithms-and-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,catalyst,xdsl,iqm]"
      - name: Run algorithms-and-integrations tests with coverage
        run: |
          pytest tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests \
            --cov=qrisp \
            --cov-branch \
            --cov-report=term:skip-covered
        env:
          COVERAGE_FILE: .coverage.algorithms
      - name: Upload algorithms coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-algorithms
          path: .coverage.algorithms
          include-hidden-files: true

  report:
    needs: [core, algorithms-and-integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.*"
      - run: pip install coverage
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report coverage
        run: |
          coverage combine
          coverage report --show-missing --omit='*/__init__.py'
