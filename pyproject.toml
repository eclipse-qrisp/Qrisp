[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "qrisp"
version = "0.9.7"
authors = [
    {name = "The Qrisp authors"},
]
description = "A high-level quantum programming language"
readme = "README.md"
requires-python = ">=3.11, <3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Software Development :: Compilers",
]
license = {text = "EPL-2.0 OR GPL-2.0 WITH Classpath-exception-2.0"}

dependencies = [
    "numpy>=2.0,<2.5",
    "sympy<=1.13",
    "qiskit>=0.44.0",
    "matplotlib>=3.5.1",
    "scipy>=1.10.0",
    "numba",
    "networkx",
    "tqdm",
    "dill",
    "psutil",
    "jax==0.7.1",
    "jaxlib==0.7.1"
]

[project.optional-dependencies]
aqt = ["qiskit-aqt-provider>=1.15.0"]
qiskit = ["qiskit-aer", "qiskit-ibm-runtime"]
iqm = [
    "iqm-client[qrisp]"
]
catalyst = ["pennylane-catalyst==0.15.0", "pennylane"]
xdsl = ["xdsl==0.59.0"]
docs = [
    "sphinx>=7,<9", # sphinx_toolbox.sidebar_links not compatible with Sphinx 9
    "sphinx-toolbox==4.1.2",
    "nbsphinx==0.9.8",
    "ipykernel==7.3.0",
    "myst-parser==5.1.0",
    "texext==0.6.8",
    "numpydoc==1.10.0",
    "sphinx-sitemap==2.9.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.7.0",
    "sphinx-thebe==0.3.1",
    "sphinx-new-tab-link==0.8.1",
    "pydata-sphinx-theme==0.17.1",
]
dev-code-style = [
    "ruff",
    "codespell",
]
dev-testing = [
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "qiskit-aer",
    "pyscf",
    "cirq",
    "tqecd",
    "iqm-client[qrisp]",
]
dev = [
    "qrisp[dev-code-style,dev-testing]",
]
# aqt is intentionally excluded from `all` because qiskit-aqt-provider ships a
# pytest plugin (qiskit_aqt_provider.test.fixtures) that fails to load when
# pytest-httpx is not installed, breaking any pytest invocation. 
# aqt also requires qiskit >=1,<2 (Qiskit 1.x), which reached end of life with
# the release of the Qiskit SDK v2.x series and no longer receives bug fixes,
# security updates, or other patches
# (https://www.ibm.com/quantum/blog/qiskit-2-5-release-summary).
all = [
    "qrisp[qiskit,iqm,catalyst,xdsl,docs,dev]",
]

[project.urls]
Homepage = "https://github.com/eclipse-qrisp/Qrisp"
"Bug Tracker" = "https://github.com/eclipse-qrisp/Qrisp/issues"

[tool.ruff]
exclude = ["__init__.py", "*.ipynb"]
line-length = 120
target-version = "py312" # will be changed to consider other python versions as well
force-exclude = true


[tool.ruff.lint]
select = ["I", "E", "W", "D", "PL", "F"]
# ruff configuration
# E, W -- pycodestyle
# D -- pydocstyle
# I -- isort
# PL -- pylint
# F -- pyflakes


ignore = [
    "D203",  # inconsistent with D211 (no-blank-line-before-class)
    "D209",  # new-line-after-last-paragraph
    "D212",  # inconsistent with D213 (multi-line-summary-first-line)
    "D213",  # inconsistent with D212 (multi-line-summary-first-line)
    "D400",  # first-line-should-end-with-period
    "D401",  # first line of docstring should be in imperative mood
    "D402",  # first-line-should-not-be-signature
    "D404",  # docstring should start with a proper description (not 'This' or 'A')
    "D415",  # ends-in-punctuation
    "D416",  # section-name-should-end-with-colon
    "PLC0415",  # import not at top of file (lazy/function-level imports to avoid circular imports)
    "E402",  # module-level import not at top of file (imports after a module docstring)
]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.codespell]
# Words that should not be corrected by codespell, with where they appear:
# aer -- "AerSimulator"/qiskit-aer references throughout the codebase (e.g. core/quantum_session.py).
# anc -- short form for ancilla (e.g. block_encodings/constructors/from_eye.py).
# bra -- Dirac bra notation (e.g. block_encodings/constructors/from_lcu.py).
# ket -- Dirac ket notation (e.g. environments/quantum_conditionals.py).
# mis -- short for Maximum Independent Set (general/tutorial/QIROtutorial.ipynb).
# tage -- German for "days" (general/imprint.rst).
# wille -- surname, e.g. R. Wille (general/papers/index.rst).
# childs -- surname, e.g. A. Childs citation (reference/Block Encodings/applications.rst).
ignore-words-list = "aer,anc,bra,childs,ket,mis,tage,wille"
# thi appears in the domain thi.uni-hannover.de and should not be corrected in URIs.
uri-ignore-words-list = "thi"
# Skip embedded base64 images in Jupyter notebooks (they contain arbitrary data).
ignore-regex = '"image/[^"]+": "[^"]*"'
# Skipped because the tket converter test uses "theRes" as a variable name.
# pyproject.toml is skipped because it contains codespell's own configuration.
# Versioned changelogs 0.1 - 0.9 are already published and must not be edited.
skip = "pyproject.toml,**/test_tket_converter.py,**/changelog/0.1.rst,**/changelog/0.2.rst,**/changelog/0.3.rst,**/changelog/0.4.rst,**/changelog/0.5.rst,**/changelog/0.6.rst,**/changelog/0.7.rst,**/changelog/0.8.rst,**/changelog/0.9.rst"

[tool.pylint. messages_control]
disable = ["import-error"]
