# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
    # imgmath compiles equations during the build, so invalid LaTeX fails the
    # build instead of only showing a MathJax error in the browser.
    - texlive-latex-base
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - texlive-science
    - dvisvgm
  jobs:
    # The CUDA-Q Interface page documents qrisp-cudaq. Install the version
    # pinned in requirements-cudaq.txt (bumped by Dependabot) without CUDA-Q
    # and its NVIDIA libraries; conf.py mocks cudaq for autodoc, and its xdsl
    # dependency comes from the xdsl extra below.
    post_install:
      - python -m pip install --no-deps -r documentation/requirements-cudaq.txt

sphinx:
  configuration: documentation/source/conf.py
  # Turn Sphinx warnings into errors so builds fail on any warning,
  # matching the previous CI docs build.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - xdsl
